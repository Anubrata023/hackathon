<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Government of Assam Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F9F5F0;
            --beige: #F2EAD3;
            --assam-orange: #F4991A;
            --assam-green: #344F1F;
            --green-dark: #1a2910;
            --green-light: #4a6f35;
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --shadow-sm: 0 2px 8px rgba(52, 79, 31, 0.08);
            --shadow-lg: 0 12px 40px rgba(52, 79, 31, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative background pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(244, 153, 26, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(52, 79, 31, 0.06) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        .welcome-card {
            background: white;
            border-radius: 30px;
            padding: 60px 50px;
            box-shadow: var(--shadow-lg);
            border: 3px solid var(--beige);
            position: relative;
            overflow: hidden;
        }

        .welcome-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--assam-orange), var(--assam-green), var(--assam-orange));
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, var(--assam-green), var(--green-light));
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(52, 79, 31, 0.25);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .portal-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--assam-green);
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .portal-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 40px;
        }

        .greetings {
            margin: 40px 0 50px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(244, 153, 26, 0.08), rgba(52, 79, 31, 0.08));
            border-radius: 20px;
            border-left: 5px solid var(--assam-orange);
        }

        .greeting-text {
            font-size: 28px;
            font-weight: 600;
            color: var(--assam-green);
            margin-bottom: 0;
            line-height: 1.6;
            transition: all 0.6s ease;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .greeting-text.bengali,
        .greeting-text.assamese {
            font-family: 'Noto Sans Bengali', sans-serif;
        }

        .animated-greeting {
            animation: none;
        }

        .blur-out {
            filter: blur(10px);
            opacity: 0;
            transform: scale(0.95);
        }

        .blur-in {
            filter: blur(0px);
            opacity: 1;
            transform: scale(1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .continue-btn {
            width: 100%;
            max-width: 350px;
            padding: 22px 40px;
            border: none;
            background: linear-gradient(135deg, var(--assam-orange), var(--assam-green));
            color: white;
            font-weight: 700;
            font-size: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 8px 25px rgba(244, 153, 26, 0.4);
            position: relative;
            overflow: hidden;
        }

        .continue-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .continue-btn:hover::before {
            left: 100%;
        }

        .continue-btn:hover {
            box-shadow: 0 12px 35px rgba(244, 153, 26, 0.5);
            transform: translateY(-3px);
        }

        .continue-btn:active {
            transform: translateY(-1px);
        }

        .decorative-element {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244, 153, 26, 0.15), transparent);
            animation: pulse 4s ease-in-out infinite;
        }

        .decorative-element.left {
            top: 20%;
            left: -40px;
        }

        .decorative-element.right {
            bottom: 20%;
            right: -40px;
            animation-delay: 2s;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        .info-text {
            margin-top: 30px;
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .welcome-card {
                padding: 50px 35px;
                border-radius: 25px;
            }

            .logo {
                width: 85px;
                height: 85px;
                font-size: 40px;
            }

            .portal-title {
                font-size: 26px;
            }

            .portal-subtitle {
                font-size: 16px;
            }

            .greeting-text {
                font-size: 24px;
                min-height: 38px;
            }

            .greetings {
                padding: 25px 20px;
                margin: 35px 0 40px;
            }

            .continue-btn {
                font-size: 18px;
                padding: 20px 35px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .welcome-card {
                padding: 40px 25px;
                border-radius: 20px;
            }

            .logo {
                width: 75px;
                height: 75px;
                font-size: 36px;
                margin-bottom: 25px;
            }

            .portal-title {
                font-size: 22px;
            }

            .portal-subtitle {
                font-size: 14px;
                margin-bottom: 30px;
            }

            .greeting-text {
                font-size: 20px;
                margin-bottom: 0;
                min-height: 32px;
            }

            .greetings {
                padding: 20px 15px;
                margin: 30px 0 35px;
            }

            .continue-btn {
                font-size: 16px;
                padding: 18px 30px;
                max-width: 100%;
            }

            .info-text {
                font-size: 14px;
                margin-top: 25px;
            }

            .decorative-element {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-card">
            <div class="decorative-element left"></div>
            <div class="decorative-element right"></div>
            
            <div class="logo">অ</div>
            
            <h1 class="portal-title">Government of Assam</h1>
            <p class="portal-subtitle">Citizen Services Portal</p>
            
            <div class="greetings">
                <h1 class="greeting-text animated-greeting" id="animatedGreeting">Welcome!</h1>
            </div>
            
            <button class="continue-btn" onclick="window.location.href='login.html'">
                Continue to Login
            </button>
            
            <p class="info-text">
                Access government services, apply for certificates, and manage your civic needs all in one place.
            </p>
        </div>
    </div>

    <script>
        // Greetings in different languages
        const greetings = [
            { text: 'Welcome!', lang: 'en' },
            { text: 'स्वागत है!', lang: 'hi' },
            { text: 'স্বাগতম!', lang: 'as' },
            { text: 'স্বাগতম!', lang: 'bn' }
        ];

        let currentIndex = 0;
        const greetingElement = document.getElementById('animatedGreeting');

        function changeGreeting() {
            // Blur out
            greetingElement.classList.add('blur-out');
            greetingElement.classList.remove('blur-in');

            setTimeout(() => {
                // Change text
                currentIndex = (currentIndex + 1) % greetings.length;
                greetingElement.textContent = greetings[currentIndex].text;
                
                // Update font family for Bengali/Assamese
                if (greetings[currentIndex].lang === 'as' || greetings[currentIndex].lang === 'bn') {
                    greetingElement.style.fontFamily = "'Noto Sans Bengali', sans-serif";
                } else {
                    greetingElement.style.fontFamily = "'Poppins', sans-serif";
                }

                // Blur in
                greetingElement.classList.remove('blur-out');
                greetingElement.classList.add('blur-in');
            }, 600);
        }

        // Start animation
        greetingElement.classList.add('blur-in');
        setInterval(changeGreeting, 3000);

        // Add smooth entrance animation
        window.addEventListener('load', () => {
            document.querySelector('.welcome-card').style.animation = 'fadeInUp 0.8s ease-out';
        });
    </script>
</body>
</html>
